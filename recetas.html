  $('clave').addEventListener('keydown', function (e) { if (e.key === 'Enter') probar(); if (e.key === 'Escape') cerrarModal(); });
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) cerrarModal(); });

  function pintarHub() {
    var cont = $('grupos'); cont.innerHTML = '';
    GRUPOS.forEach(function (gr) {
      var card = document.createElement('div'); card.className = 'card';
      var h = document.createElement('div'); h.className = 'top-head';
      var dot = document.createElement('i'); dot.style.background = gr.c;
      var h2 = document.createElement('h2'); h2.textContent = gr.n; h.appendChild(dot); h.appendChild(h2); card.appendChild(h);
      var p = document.createElement('p'); p.className = 'grupo-desc'; p.textContent = gr.d; card.appendChild(p);
      var g = document.createElement('div'); g.className = 'clases';
      RECETAS.filter(function (r) { return r.g === gr.g; }).forEach(function (r) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'clase t' + (ok(r.n) ? ' ok' : '');
        b.innerHTML = '<span class="cand"></span><b></b>'; b.querySelector('b').textContent = r.n;
        b.querySelector('.cand').textContent = ok(r.n) ? '✓' : '🔑';
        b.setAttribute('aria-label', 'Receta ' + r.n);
        b.onclick = function () { ok(r.n) ? ver(r) : abrirModal(r); };
        g.appendChild(b);
      });
      card.appendChild(g); cont.appendChild(card);
    });
  }
  function fmt(x) { var v = Math.round(x * 100) / 100; return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, function (m, o, s) { return s.indexOf('.') >= 0 && o > s.indexOf('.') ? '' : ','; }); }
  function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function ver(r) {
    $('hub').hidden = true; var v = $('vista'); v.hidden = false; window.scrollTo(0, 0);
    var base = r.ing.reduce(function (a, i) { return a + i[1]; }, 0);
    var h = '<div class="card"><span class="tag">Receta ' + r.n + '</span><h2>' + esc(r.nombre) + '</h2><p>' + esc(r.desc) + '</p>';
    if (r.ing.length) {
      h += '<div class="campo"><div><label for="tot">Cantidad total (g)</label><input type="number" id="tot" inputmode="decimal" min="0" step="any"></div>' +
           '<div><label for="uno" id="uno-l"></label><input type="number" id="uno" inputmode="decimal" min="0" step="any"></div></div>';
      h += '<div class="barra" id="barra"></div><div id="lista"></div>';
    }
    h += '</div>';
    if (r.pasos.length) h += '<div class="card"><h2>Preparación</h2><ol>' + r.pasos.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol></div>';
    if (r.notas.length || r.texto.length || r.fuente) {
      h += '<div class="card"><h2>Notas</h2>' + r.notas.map(function (n) { return '<p class="nota">' + esc(n) + '</p>'; }).join('') +
           (r.texto.length ? '<ul>' + r.texto.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') +
           (r.fuente ? '<p class="suave">Fuente: ' + esc(r.fuente) + '</p>' : '') + '</div>';
    }
    h += '<div class="card"><button class="btn sec" id="volver" type="button" style="margin-top:0">← Todas las recetas</button></div>';
    v.innerHTML = h; $('volver').onclick = function () { v.hidden = true; $('hub').hidden = false; window.scrollTo(0, 0); };
    if (!r.ing.length) return;
    var tot = $('tot'), uno = $('uno'); tot.value = 500; $('uno-l').textContent = 'Gramos de: ' + r.ing[0][0].toLowerCase();
    function pintar() {
      var t = parseFloat(tot.value) || 0, f = base ? t / base : 0, L = $('lista'), B = $('barra'); L.innerHTML = ''; B.innerHTML = '';
      r.ing.forEach(function (i, k) {
        var q = i[1] * f, pc = base ? i[1] / base * 100 : 0, d = document.createElement('div'); d.className = 'rowi';
        d.innerHTML = '<span>' + esc(i[0]) + '<small>' + fmt(pc) + ' %</small></span><b>' + fmt(q) + ' ' + i[2] + '</b>'; L.appendChild(d);
        var s = document.createElement('i'); s.style.width = pc + '%'; s.style.background = COLORES[k % COLORES.length]; B.appendChild(s);
      });
      if (document.activeElement !== uno) uno.value = r.ing.length ? Math.round(r.ing[0][1] * f * 100) / 100 : '';
    }
    tot.addEventListener('input', pintar);
    uno.addEventListener('input', function () { var q = parseFloat(uno.value) || 0; tot.value = r.ing[0][1] ? Math.round(q / r.ing[0][1] * base * 100) / 100 : 0; pintar(); });
    uno.addEventListener('blur', pintar);
    pintar();
  }
  pintarHub();
  fetch('content.json?_=' + Date.now()).then(function (r) { return r.json(); }).then(function (content) {
    var R = window.TratakRender;
    R.applyTheme(content.theme, document.documentElement.style);
    $('site-top').innerHTML = R.renderNav(content.theme);
    $('site-floating').innerHTML = R.renderFloatingButtons(content.contacto);
    document.body.classList.add('con-nav');
    R.bindGlobalInteractions(content.theme);
    if (window.Shishi) Shishi.montar(content);
  }).catch(function () {});
})();
</script>
</body>
</html>
