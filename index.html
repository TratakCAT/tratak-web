<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon_32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon_16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon_180.png">

<meta name="apple-mobile-web-app-title" content="TRATAK CAT">
<title>Impresión 3D sustentable y biomateriales · Escuela-laboratorio TRATAK CAT, Guadalajara</title>
<meta name="description" content="Escuela-laboratorio en Guadalajara: aprende impresión 3D sustentable y biomateriales con talleres, cursos y piezas bajo pedido. Contempla y biofabrica la materia viva.">
<meta name="theme-color" content="#e9e2d1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Work+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=36">
<link rel="stylesheet" href="assets/shishi.css?v=36">
<style id="precarga-css">
#precarga{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-family:Georgia,"Times New Roman",serif;transition:opacity .8s ease,transform .8s ease,visibility .8s}
#precarga.fuera{opacity:0;visibility:hidden;transform:scale(1.04)}
#precarga .pc-txt{font-size:14px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:0 24px;min-height:1.5em}
#precarga .pc-stage{position:relative;width:200px;height:230px;display:flex;align-items:center;justify-content:center}
/* A · el punto de Tratak que florece en gankyil */
#precarga.pc-a{background:radial-gradient(circle at 50% 45%,#2a1f47 0,#0e0b18 72%);color:#efe8f8}
.pc-a .pc-punto{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 18px 6px rgba(255,255,255,.55),0 0 60px 18px rgba(192,162,236,.45);animation:pcPunto 2.6s ease-in-out infinite,pcPuntoFuera .5s ease .85s forwards}
.pc-a .pc-gk{position:absolute;width:190px;height:190px;opacity:0;transform:scale(.15);animation:pcFlor 1.5s cubic-bezier(.2,.8,.2,1) .7s forwards}
.pc-a .pc-gk .gk-svg,.pc-a .pc-gk .gk-svg-el{width:100%;height:100%;max-width:none}
.pc-a .pc-gk .gk-rota{animation-duration:14s}
#precarga.pc-a .pc-txt{font-style:italic;text-transform:none;letter-spacing:.05em;font-size:20px;line-height:1.35;max-width:320px;opacity:0;animation:pcTxt 1.1s ease 1.4s forwards}
@keyframes pcPunto{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes pcPuntoFuera{to{opacity:0;transform:scale(.3)}}
@keyframes pcFlor{to{opacity:1;transform:scale(1)}}
@keyframes pcTxt{to{opacity:.92}}
/* B · un casco de VR proyecta en holograma una pieza que se imprime por capas y de la que brotan hongos */
#precarga.pc-b{background:radial-gradient(circle at 50% 55%,#13213a 0,#070b14 75%);color:#cfe4f6}
.pc-b .pc-stage{width:220px;height:304px}
.pc-b svg{width:220px;height:auto;overflow:visible}
.pc-b .pc-holo{animation:pcFlick 3.1s steps(1) infinite}
.pc-b .pc-scan{animation:pcScan 1.2s linear infinite}
.pc-b .pc-capa{opacity:0}
.pc-b .pc-hongo{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0)}
.pc-b .pc-boq{opacity:0}
.pc-b.go .pc-capa{animation:pcCapa .25s ease forwards;animation-delay:var(--d)}
.pc-b.go .pc-hongo{animation:pcHongo .7s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d)}
.pc-b.go .pc-boq{animation:pcBoq 1.7s linear forwards}
.pc-b.go .pc-escena{animation:pcEsc 5.2s linear forwards}
@keyframes pcCapa{to{opacity:1}}
@keyframes pcHongo{to{transform:scale(1)}}
@keyframes pcBoq{0%{transform:translateY(0);opacity:1}94%{transform:translateY(-188px);opacity:1}100%{transform:translateY(-188px);opacity:0}}
@keyframes pcEsc{0%,86%{opacity:1}98%,100%{opacity:0}}
@keyframes pcScan{to{transform:translateY(6px)}}
@keyframes pcFlick{0%{opacity:1}46%{opacity:.82}48%{opacity:1}83%{opacity:.9}85%{opacity:1}}
/* C · respiración por la nariz: inhala, pausa, exhala */
#precarga.pc-c{background:linear-gradient(160deg,#c9a6ee,#a9d2f0 55%,#c3f0b9);color:#2a2140}
.pc-c .pc-stage{width:220px;height:220px}
.pc-c .pc-aro{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.22);animation:pcResp 8s ease-in-out infinite}
.pc-c .pc-aro:nth-child(1){width:70px;height:70px;background:rgba(255,255,255,.92)}
.pc-c .pc-bindu{position:absolute;width:12px;height:12px;border-radius:50%;background:#08080c}
.pc-c .pc-aro:nth-child(2){width:120px;height:120px;animation-delay:.25s}
.pc-c .pc-aro:nth-child(3){width:170px;height:170px;animation-delay:.5s}
.pc-c .pc-aro:nth-child(4){width:220px;height:220px;animation-delay:.75s;opacity:.7}
.pc-c .pc-txt{position:relative;height:1.5em;width:min(360px,92vw);padding:0}
.pc-c .pc-txt span{position:absolute;left:0;right:0;opacity:0;animation:pcInh 8s ease-in-out infinite}
.pc-c .pc-txt span+span{animation-name:pcExh}
@keyframes pcResp{0%{transform:scale(.55)}40%,57.5%{transform:scale(1)}97.5%,100%{transform:scale(.55)}}
@keyframes pcInh{0%{opacity:0}6%,36%{opacity:.95}44%,100%{opacity:0}}
@keyframes pcExh{0%,56%{opacity:0}62%,92%{opacity:.95}98%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #precarga *{animation:none!important}
  .pc-a .pc-punto{display:none}.pc-a .pc-gk{opacity:1;transform:none}.pc-a .pc-txt{opacity:.92}
  .pc-b .pc-capa{opacity:1}.pc-b .pc-hongo{transform:scale(1)}.pc-b .pc-boq{display:none}
  .pc-c .pc-aro{transform:scale(.8)}.pc-c .pc-txt span+span{display:none}.pc-c .pc-txt span{opacity:.95}
}
</style>
</head>
<body>

<div id="precarga" aria-hidden="true"></div>
<script>
// Pantalla de carga: una de tres experiencias al azar (el punto de Tratak, el holograma que se imprime, la respiración).
// Solo se ve al entrar por primera vez en la sesión. Para probar: ?precarga=a, ?precarga=b, ?precarga=c o ?precarga=1 (al azar).
(function () {
  var el = document.getElementById('precarga');
  var q = (location.search.match(/[?&]precarga=([abc1])/) || [])[1];
  var visto = false;
  try { visto = sessionStorage.getItem('tk-precarga') === '1'; } catch (e) {}
  window.__precargaFuera = function () {};
  if (!el || (visto && !q)) { if (el && el.parentNode) el.parentNode.removeChild(el); return; }
  var tipos = ['a', 'b', 'c'], tipo = q && q !== '1' ? q : null;
  if (!tipo) {
    var ultimo = null; try { ultimo = localStorage.getItem('tk-precarga-ultimo'); } catch (e) {}
    var otros = tipos.filter(function (t) { return t !== ultimo; });
    tipo = otros[Math.floor(Math.random() * otros.length)];
  }
  try { localStorage.setItem('tk-precarga-ultimo', tipo); } catch (e) {}
  var html = '', ciclo = null;
  if (tipo === 'a') {
    var lemas = ['La curiosidad despertó al gato', 'El maullido del dharma', 'Más allá de la industria'];
    html = '<div class="pc-stage"><i class="pc-punto"></i><div class="pc-gk" id="pc-gk"></div></div><div class="pc-txt">' + lemas[Math.floor(Math.random() * lemas.length)] + '</div>';
  } else if (tipo === 'b') {
    var N = 30, capas = '', i, y, t, r, g, b;
    for (i = 0; i < N; i++) {
      y = 228 - i * (186 / (N - 1)); t = i / (N - 1);
      r = Math.round(192 + (185 - 192) * t); g = Math.round(162 + (237 - 162) * t); b = Math.round(236 + (178 - 236) * t);
      capas += '<line class="pc-capa" x1="50" x2="170" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="rgb(' + r + ',' + g + ',' + b + ')" stroke-width="5.4" style="--d:' + (i * 0.052).toFixed(3) + 's"/>';
    }
    // hongos blancos y minimalistas: x, y, escala, inclinación, retraso
    var hongos = [[100, 41, 1, -4, 1.9], [119, 40, .72, 8, 2.05], [66, 104, 1, -14, 2.2], [155, 104, .85, 12, 2.35], [64, 176, .7, -12, 2.5], [157, 172, .8, 10, 2.65]];
    var mh = hongos.map(function (h) {
      return '<g transform="translate(' + h[0] + ' ' + h[1] + ') rotate(' + h[3] + ') scale(' + h[2] + ')"><g class="pc-hongo" style="--d:' + h[4] + 's">' +
        '<rect x="-2" y="-11" width="4" height="11.5" rx="2" fill="#fff"/><path d="M-10 -10A10 9 0 0 1 10 -10Z" fill="#fff"/></g></g>';
    }).join('');
    // casco de VR en perspectiva (tres cuartos, visto desde arriba), apoyado con los lentes hacia arriba
    var top = 'M70 244H150Q166 244 166 258Q166 272 152 276Q138 278 130 272Q110 262 90 272Q82 278 68 276Q54 272 54 258Q54 244 70 244Z', grosor = '';
    [18, 15, 12, 9, 6, 3].forEach(function (d, k) {
      grosor += '<path transform="translate(0 ' + d + ')" d="' + top + '" fill="' + ['#0a1122', '#0d1529', '#111a31', '#15203a', '#19264a', '#1c2b52'][k] + '"/>';
    });
    html = '<div class="pc-stage"><svg viewBox="0 0 220 304" aria-hidden="true"><defs>' +
      '<linearGradient id="pch" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9fcbec" stop-opacity=".6"/><stop offset="1" stop-color="#9fcbec" stop-opacity=".05"/></linearGradient>' +
      '<pattern id="pcs" width="220" height="6" patternUnits="userSpaceOnUse"><rect width="220" height="1.2" fill="#cfe9ff" opacity=".22"/></pattern>' +
      '<clipPath id="pcc"><path d="M72 256L148 256L204 22L16 22Z"/></clipPath>' +
      '<clipPath id="pcv"><path transform="translate(30 30)" d="M62 10C62 30 40 40 34 72C26 112 38 170 52 198L108 198C122 170 134 112 126 72C120 40 98 30 98 10Z"/></clipPath></defs>' +
      '<g class="pc-holo"><path d="M72 256L148 256L204 22L16 22Z" fill="url(#pch)"/><g clip-path="url(#pcc)"><rect class="pc-scan" x="0" y="16" width="220" height="252" fill="url(#pcs)"/></g>' +
      '<path d="M72 256L16 22M148 256L204 22" stroke="#9fcbec" stroke-opacity=".5" stroke-width="1" fill="none"/>' +
      '<ellipse cx="110" cy="240" rx="54" ry="6" fill="#9fcbec" opacity=".4"/>' +
      '<g class="pc-escena"><g clip-path="url(#pcv)">' + capas + '</g>' + mh +
      '<g class="pc-boq"><circle cx="110" cy="232" r="4" fill="#fff"/><path d="M106 226l4 -8l4 8z" fill="#fff"/></g></g></g>' +
      '<rect x="34" y="262" width="30" height="14" rx="7" fill="#0d1529"/><rect x="156" y="262" width="30" height="14" rx="7" fill="#0d1529"/>' +
      grosor +
      '<path d="' + top + '" fill="#1d2d52" stroke="#7fa6d9" stroke-width="1.3"/>' +
      '<path transform="translate(110 260) scale(.88 .72) translate(-110 -260)" d="' + top + '" fill="none" stroke="#9fcbec" stroke-opacity=".35"/>' +
      '<ellipse cx="88" cy="259" rx="16" ry="8.5" fill="#0a1122" stroke="#9fcbec" stroke-width="1"/><ellipse cx="132" cy="259" rx="16" ry="8.5" fill="#0a1122" stroke="#9fcbec" stroke-width="1"/>' +
      '<ellipse cx="88" cy="259" rx="10" ry="5" fill="#9fcbec" opacity=".75"/><ellipse cx="132" cy="259" rx="10" ry="5" fill="#9fcbec" opacity=".75"/>' +
      '<ellipse cx="88" cy="258" rx="4" ry="2" fill="#fff"/><ellipse cx="132" cy="258" rx="4" ry="2" fill="#fff"/>' +
      '</svg></div><div class="pc-txt">Biofabricando la materia</div>';
    ciclo = 5200;
  } else {
    html = '<div class="pc-stage"><i class="pc-aro"></i><i class="pc-aro"></i><i class="pc-aro"></i><i class="pc-aro"></i><i class="pc-bindu"></i></div><div class="pc-txt"><span>Inhala por la nariz</span><span>Exhala por la nariz</span></div>';
  }
  el.className = 'pc-' + tipo; el.innerHTML = html;
  var timer = null;
  if (ciclo) {
    el.classList.add('go');
    timer = setInterval(function () { el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }, ciclo);
  }
  var inicio = Date.now(), MIN = { a: 2400, b: 4400, c: 7800 }[tipo], quitado = false;
  window.__precargaFuera = function () {
    if (quitado) return; quitado = true;
    setTimeout(function () {
      el.classList.add('fuera');
      try { sessionStorage.setItem('tk-precarga', '1'); } catch (e) {}
      setTimeout(function () { if (timer) clearInterval(timer); if (el.parentNode) el.parentNode.removeChild(el); }, 900);
    }, Math.max(0, MIN - (Date.now() - inicio)));
  };
  window.__precargaTipo = tipo;
})();
</script>

<div id="app">
  <!-- Este contenido se reemplaza al cargar; sirve como respaldo si JS falla -->
  <p style="padding:40px;font-family:sans-serif;">Cargando TRATAK · CAT…</p>
</div>

<script src="assets/site.js?v=36"></script>
<script src="assets/shishi.js?v=36"></script>
<script>
  (function () { var h = document.getElementById("pc-gk"); if (h && window.TratakRender && TratakRender.gankyilSVG) h.innerHTML = TratakRender.gankyilSVG({ id: "pre" }); })();
</script>
<script>
  // Red de seguridad: si después de 12s sigue "Cargando...", muestra un aviso (nunca se queda colgado)
  var candadoDeCarga = setTimeout(function () {
    var app = document.getElementById('app');
    if (app && app.textContent.indexOf('Cargando') !== -1) {
      app.innerHTML = '<p style="padding:40px;font-family:sans-serif;">Esto está tardando más de lo normal. <a href="javascript:location.reload()">Reintentar</a></p>';
      window.__precargaFuera();
    }
  }, 12000);

  Promise.all([
    TratakRender.fetchConTiempoLimite('content.json?_=' + Date.now()).then(function (r) { return r.json(); }),
    window.TratakRender ? TratakRender.fetchEventosDesdeGitHub() : Promise.resolve([])
  ]).then(function (results) {
    clearTimeout(candadoDeCarga);
    var content = results[0];
    var eventos = results[1] || [];
    var proximos = eventos.filter(function (e) { return e.es_proximo; });
    document.getElementById('app').innerHTML = TratakRender.renderFullPage(content, proximos, eventos);
    TratakRender.applyTheme(content.theme, document.documentElement.style);
    TratakRender.bindGlobalInteractions(content.theme);
    if (window.Shishi) Shishi.montar(content);
    window.__precargaFuera();
  }).catch(function (err) {
    clearTimeout(candadoDeCarga);
    console.error('No se pudo cargar el contenido del sitio', err);
    document.getElementById('app').innerHTML = '<p style="padding:40px;font-family:sans-serif;">Hubo un problema cargando el contenido. Intenta recargar la página.</p>';
    window.__precargaFuera();
  });
</script>

</body>
</html>
