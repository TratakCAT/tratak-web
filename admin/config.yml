backend:
  name: git-gateway
  branch: main
  identity_url: "https://tratak.netlify.app/.netlify/identity"
  gateway_url: "https://tratak.netlify.app/.netlify/git"

media_folder: "images"
public_folder: "/images"

collections:
  - name: "sitio"
    label: "Sitio principal (index)"
    files:
      - file: "content.json"
        label: "Contenido del sitio"
        name: "content"
        fields:

          - label: "Tema (colores, tipografía y logos)"
            name: "theme"
            widget: object
            fields:
              - { label: "Color de fondo (modo día)", name: "color_paper", widget: color }
              - { label: "Color de texto principal (modo día)", name: "color_ink", widget: color }
              - { label: "Color de acento (arcilla)", name: "color_clay", widget: color }
              - { label: "Color de acento (moss)", name: "color_moss", widget: color }
              - { label: "Color de texto secundario (etiquetas, notas)", name: "color_dust", widget: color }
              - { label: "Color de fondo (modo noche)", name: "color_paper_oscuro", widget: color, required: false, hint: "Si lo dejas vacío, se usa un oscuro por default" }
              - { label: "Color de texto (modo noche)", name: "color_ink_oscuro", widget: color, required: false }
              - { label: "Color de texto secundario (modo noche)", name: "color_dust_oscuro", widget: color, required: false }
              - { label: "Logo TRATAK (opcional)", name: "logo_tratak", widget: image, required: false }
              - { label: "Logo CAT (opcional)", name: "logo_cat", widget: image, required: false }
              - { label: "Logo TRATAK para modo noche (opcional, si tu logo normal es oscuro y se pierde con fondo oscuro)", name: "logo_tratak_oscuro", widget: image, required: false }
              - { label: "Logo CAT para modo noche (opcional)", name: "logo_cat_oscuro", widget: image, required: false }
              - label: "Pareja de tipografías (global, por default)"
                name: "font_pair"
                widget: select
                options: &font_pairs
                  - { label: "Fraunces + Space Grotesk (editorial cálido)", value: "fraunces_space" }
                  - { label: "Playfair Display + Inter (clásico elegante)", value: "playfair_inter" }
                  - { label: "Libre Baskerville + IBM Plex Sans (literario)", value: "baskerville_plex" }
                  - { label: "DM Serif Display + Work Sans (moderno editorial)", value: "dmserif_work" }
                  - { label: "Cormorant Garamond + Manrope (delicado)", value: "cormorant_manrope" }

          - label: "Portada (Hero)"
            name: "hero"
            widget: object
            fields:
              - { label: "Layout", name: "estilo", widget: select, options: [{label: "Imagen al lado del texto", value: "lado"}, {label: "Imagen de fondo completo", value: "fondo"}], default: "lado" }
              - { label: "Color de acento propio (opcional, si no usa el del tema)", name: "color_acento", widget: color, required: false }
              - { label: "Tipografía propia (opcional, si no usa la del tema)", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
              - { label: "Frase pequeña arriba del título", name: "kicker", widget: string }
              - { label: "Título — línea 1", name: "title_line1", widget: string }
              - { label: "Título — antes de la palabra en cursiva", name: "title_pre", widget: string }
              - { label: "Título — palabra en cursiva", name: "title_em", widget: string }
              - { label: "Título — línea final", name: "title_line3", widget: string }
              - { label: "Texto debajo del título", name: "lede", widget: text }
              - { label: "Foto (al lado o de fondo, según el layout elegido)", name: "image", widget: image }
              - { label: "Botón 1 — texto", name: "cta1_label", widget: string }
              - { label: "Botón 1 — link", name: "cta1_link", widget: string }
              - { label: "Botón 2 — texto", name: "cta2_label", widget: string }
              - { label: "Botón 2 — link", name: "cta2_link", widget: string }
              - { label: "Botón 3 — texto", name: "cta3_label", widget: string }
              - { label: "Botón 3 — link", name: "cta3_link", widget: string }

          - label: "Secciones de la página (arrastra para reordenar, agrega o quita las que quieras)"
            name: "secciones"
            widget: list
            types:

              - label: "Estadísticas / números"
                name: "estadisticas"
                fields: &comunes_sin_lado
                  - { label: "Identificador único (sin espacios)", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio (opcional, si no usa el del tema)", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia (opcional, si no usa la del tema)", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - label: "Números"
                    name: "stats"
                    widget: list
                    fields:
                      - { label: "Número", name: "number", widget: string }
                      - { label: "Descripción", name: "label", widget: string }

              - label: "Pilares / tarjetas cortas"
                name: "pilares"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Título de la sección", name: "titulo", widget: string }
                  - label: "Tarjetas"
                    name: "items"
                    widget: list
                    fields:
                      - { label: "Número/etiqueta (ej. 01 · contemplación)", name: "num", widget: string }
                      - { label: "Título", name: "title", widget: string }
                      - { label: "Texto", name: "text", widget: text }

              - label: "Sección destacada (texto + imagen)"
                name: "destacado"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Layout", name: "estilo", widget: select, options: [{label: "Imagen de fondo completo", value: "fondo"}, {label: "Imagen al lado del texto", value: "lado"}], default: "fondo" }
                  - { label: "Fondo (solo aplica con layout 'fondo')", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "imagen" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen (de fondo, o al lado según el layout)", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4 (solo layout 'fondo'; gana sobre la foto)", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "claro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Título", name: "titulo", widget: string }
                  - { label: "Párrafo 1", name: "texto1", widget: text }
                  - { label: "Párrafo 2", name: "texto2", widget: text, required: false }
                  - { label: "Botón — texto", name: "boton_texto", widget: string, required: false }
                  - { label: "Botón — link", name: "boton_link", widget: string, required: false }

              - label: "Lista de precios / programas"
                name: "lista_precios"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Título de la sección", name: "titulo", widget: string }
                  - label: "Programas"
                    name: "items"
                    widget: list
                    fields:
                      - { label: "Foto (opcional)", name: "imagen", widget: image, required: false }
                      - { label: "Código", name: "code", widget: string }
                      - { label: "Nombre del programa", name: "title", widget: string }
                      - { label: "Detalles (formato, sesiones)", name: "meta", widget: string }
                      - { label: "Precio (o texto tipo 'Consultar precio')", name: "price", widget: string }
                      - { label: "Identificador único (crea una página propia con más info, ej. taller-vr)", name: "slug", widget: string, required: false }
                      - { label: "Descripción larga (se muestra en la página propia de este programa)", name: "descripcion_larga", widget: text, required: false }

              - label: "Productos / tienda"
                name: "productos"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Título de la sección", name: "titulo", widget: string }
                  - label: "Productos"
                    name: "items"
                    widget: list
                    fields:
                      - { label: "Nombre de la pieza", name: "name", widget: string }
                      - { label: "Categoría", name: "cat", widget: string }
                      - { label: "Precio", name: "price", widget: string }
                      - { label: "Foto", name: "image", widget: image, required: false }

              - label: "Galería de fotos"
                name: "galeria"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Título de la sección", name: "titulo", widget: string }
                  - label: "Piezas de la galería"
                    name: "items"
                    widget: list
                    fields:
                      - { label: "Foto", name: "image", widget: image, required: false }
                      - { label: "Descripción (ej. Cerámica — Jarrón)", name: "caption", widget: string }

              - label: "Video y animación en vivo"
                name: "media"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Título de la sección", name: "titulo", widget: string }
                  - { label: "Link de YouTube", name: "video_url", widget: string }
                  - { label: "Descripción del video", name: "video_caption", widget: string }
                  - { label: "Link del sketch de p5.js (formato /full/)", name: "p5_url", widget: string }
                  - { label: "Descripción de la animación", name: "p5_caption", widget: string }

              - label: "Blog"
                name: "blog"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Título de la sección", name: "titulo", widget: string }
                  - label: "Entradas del blog"
                    name: "items"
                    widget: list
                    fields:
                      - { label: "Título de la entrada", name: "titulo", widget: string }
                      - { label: "Fecha", name: "fecha", widget: string }
                      - { label: "Resumen corto", name: "resumen", widget: text }
                      - { label: "Foto", name: "imagen", widget: image, required: false }
                      - { label: "Link (a dónde lleva al hacer clic)", name: "link", widget: string, required: false }

              - label: "Personajes / referentes"
                name: "personajes"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Título de la sección", name: "titulo", widget: string }
                  - label: "Personajes"
                    name: "items"
                    widget: list
                    fields:
                      - { label: "Nombre", name: "nombre", widget: string }
                      - { label: "Rol o disciplina", name: "rol", widget: string }
                      - { label: "Foto", name: "imagen", widget: image, required: false }
                      - { label: "Biografía corta", name: "bio", widget: text }

              - label: "Texto destacado / manifiesto"
                name: "texto_destacado"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo (elige 'imagen' para agregarle una foto)", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string }
                  - { label: "Texto", name: "texto", widget: text }

              - label: "Próximo evento"
                name: "evento_proximo"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string, default: "Próximo evento" }
                  - { label: "Nota", name: "_nota", widget: hidden, default: "El título, fecha y descripción se jalan automáticamente de tus eventos marcados como 'próximo' en la colección Eventos — edítalos allá." }

              - label: "Calendario de eventos"
                name: "calendario"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio (color de los días con evento)", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string, default: "Agenda" }
                  - { label: "Título de la sección", name: "titulo", widget: string, default: "Calendario de eventos" }
                  - { label: "¿Cuántos meses mostrar?", name: "num_meses", widget: select, options: ["1", "2", "3"], default: "2" }

              - label: "Eventos pasados (con botón de 'solicitar que se repita')"
                name: "eventos_pasados"
                fields:
                  - { label: "Identificador único", name: "id", widget: string }
                  - { label: "Fondo", name: "fondo", widget: select, options: ["ninguno", "color", "imagen", "video"], default: "ninguno" }
                  - { label: "Color de fondo", name: "color_fondo", widget: color, required: false }
                  - { label: "Imagen de fondo", name: "imagen_fondo", widget: image, required: false }
                  - { label: "Video de fondo .mp4", name: "video_fondo", widget: file, required: false }
                  - { label: "Color de texto", name: "color_texto", widget: select, options: ["oscuro", "claro"], default: "oscuro" }
                  - { label: "Color de acento propio", name: "color_acento", widget: color, required: false }
                  - { label: "Tipografía propia", name: "estilo_fuente", widget: select, required: false, options: *font_pairs }
                  - { label: "Etiqueta pequeña", name: "eyebrow", widget: string, default: "Ya lo hicimos" }
                  - { label: "Título de la sección", name: "titulo", widget: string, default: "Eventos pasados" }
                  - label: "Eventos"
                    name: "items"
                    widget: list
                    fields:
                      - { label: "Título del evento", name: "titulo", widget: string }
                      - { label: "Fecha", name: "fecha", widget: string }
                      - { label: "Descripción", name: "descripcion", widget: text }
                      - { label: "Foto", name: "foto", widget: image, required: false }
                      - { label: "Mensaje de WhatsApp precargado (opcional; si lo dejas vacío, se genera uno automático)", name: "mensaje_whatsapp", widget: string, required: false }

          - label: "Contacto"
            name: "contacto"
            widget: object
            fields:
              - { label: "Color de fondo (opcional)", name: "color_fondo", widget: color, required: false }
              - { label: "Color de acento propio (opcional)", name: "color_acento", widget: color, required: false }
              - { label: "Pregunta principal", name: "titulo", widget: string }
              - { label: "Texto de invitación", name: "texto", widget: text }
              - { label: "WhatsApp (solo números, con código de país, ej. 523332480698)", name: "whatsapp", widget: string }
              - { label: "WhatsApp (cómo se muestra, ej. +52 333 248 0698)", name: "whatsapp_display", widget: string }
              - { label: "Correo", name: "email", widget: string }
              - { label: "Ubicación", name: "ubicacion", widget: string }
              - { label: "Horario", name: "horario", widget: string }

  - name: "eventos"
    label: "Eventos"
    folder: "events"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    summary: "{{fields.fecha}} — {{fields.titulo_evento_html}}"
    fields:
      - { label: "¿Es el próximo evento? (aparece destacado en el home)", name: "es_proximo", widget: boolean, default: false }
      - { label: "Identificador único para el link (sin espacios ni acentos, ej. taller-octubre)", name: "slug", widget: string }
      - { label: "Fecha real (para el calendario)", name: "fecha_iso", widget: date, required: false, format: "YYYY-MM-DD" }
      - { label: "Fecha (como se muestra, ej. 10 de septiembre)", name: "fecha", widget: string }
      - { label: "Título del evento (puede incluir <br> y <em>)", name: "titulo_evento_html", widget: string }
      - { label: "Descripción corta", name: "descripcion", widget: text }
      - { label: "Foto del evento (opcional, aparece como fondo del encabezado)", name: "foto_hero", widget: image, required: false }
      - { label: "Color de acento propio (opcional, para esta página en particular)", name: "color_acento", widget: color, required: false }
      - { label: "Horario", name: "horario", widget: string }
      - { label: "Sede / dirección", name: "sede", widget: string }
      - { label: "Texto de aportación", name: "aporte_texto", widget: string }
      - { label: "Link del Google Form", name: "google_form_url", widget: string }
      - { label: "WhatsApp (solo números, con código de país)", name: "whatsapp", widget: string }
      - label: "Temas del taller"
        name: "temas"
        widget: list
        fields:
          - { label: "Etiqueta (ej. 01 · Diseño en VR)", name: "tag", widget: string }
          - { label: "Título", name: "title", widget: string }
          - { label: "Texto", name: "text", widget: text }
      - label: "Perfil de asistentes"
        name: "perfil"
        widget: list
        field: { label: "Perfil", name: "perfil_item", widget: string }
      - { label: "Texto de 'después de este taller'", name: "despues_texto", widget: text }
