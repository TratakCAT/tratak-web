<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — TRATAK CAT</title>
  <script src="https://identity.netlify.com/v1/netlify-identity.js"></script>
</head>
<body>
  <script>
    netlifyIdentity.init({
      APIUrl: "https://tratak.netlify.app/.netlify/identity"
    });
  </script>
  <!-- Conversión automática de fotos HEIC/HEIF (iPhone) a JPG al subirlas -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
  <script>
    (function () {
      var ES_HEIC = /\.(heic|heif)$/i;

      function convertirArchivo(f) {
        if (!ES_HEIC.test(f.name)) return Promise.resolve(f);
        return heic2any({ blob: f, toType: "image/jpeg", quality: 0.85 })
          .then(function (blobConvertido) {
            var out = Array.isArray(blobConvertido) ? blobConvertido[0] : blobConvertido;
            var nuevoNombre = f.name.replace(ES_HEIC, ".jpg");
            return new File([out], nuevoNombre, { type: "image/jpeg" });
          })
          .catch(function (err) {
            console.error("No se pudo convertir " + f.name + " de HEIC a JPG:", err);
            return f; // si falla la conversión, deja pasar el original
          });
      }

      function hayHeic(lista) {
        for (var i = 0; i < lista.length; i++) {
          if (ES_HEIC.test(lista[i].name)) return true;
        }
        return false;
      }

      // Selección de archivo normal (botón "Choose an image")
      document.addEventListener(
        "change",
        function (e) {
          var input = e.target;
          if (!input || input.tagName !== "INPUT" || input.type !== "file") return;
          var files = input.files;
          if (!files || !files.length || !hayHeic(files)) return;
          e.stopImmediatePropagation();
          e.preventDefault();
          Promise.all(Array.prototype.map.call(files, convertirArchivo)).then(function (nuevos) {
            var dt = new DataTransfer();
            nuevos.forEach(function (f) { dt.items.add(f); });
            input.files = dt.files;
            input.dispatchEvent(new Event("change", { bubbles: true }));
          });
        },
        true
      );

      // Arrastrar y soltar una foto directo a un campo de imagen
      document.addEventListener(
        "drop",
        function (e) {
          var files = e.dataTransfer && e.dataTransfer.files;
          if (!files || !files.length || !hayHeic(files)) return;
          e.stopImmediatePropagation();
          e.preventDefault();
          Promise.all(Array.prototype.map.call(files, convertirArchivo)).then(function (nuevos) {
            var dt = new DataTransfer();
            nuevos.forEach(function (f) { dt.items.add(f); });
            var nuevoDrop = new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt });
            e.target.dispatchEvent(nuevoDrop);
          });
        },
        true
      );
    })();
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Motor compartido de renderizado: el mismo que usa el sitio real -->
  <script src="../assets/site.js?v=18"></script>

  <script>
    // Estilos del sitio real, aplicados dentro del iframe de preview
    CMS.registerPreviewStyle("../styles.css?v=18");
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Work+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap");

    // Preview del archivo "content.json" (sitio principal)
    var SitioPreview = createClass({
      getInitialState: function () {
        return { eventosProximos: [], todosLosEventos: [] };
      },
      componentDidMount: function () {
        var self = this;
        TratakRender.fetchEventosDesdeGitHub().then(function (eventos) {
          self.setState({
            eventosProximos: eventos.filter(function (e) { return e.es_proximo; }),
            todosLosEventos: eventos
          });
        });
      },
      render: function () {
        var data = this.props.entry.getIn(['data']);
        var plain = data ? data.toJS() : {};
        var html = TratakRender.renderFullPage(plain, this.state.eventosProximos, this.state.todosLosEventos);
        return h('div', { dangerouslySetInnerHTML: { __html: html } });
      }
    });
    CMS.registerPreviewTemplate('content', SitioPreview);

    // Preview de cada entrada individual de la colección "Eventos" (carpeta /events/)
    var EventoIndividualPreview = createClass({
      getInitialState: function () {
        return { theme: null };
      },
      componentDidMount: function () {
        var self = this;
        fetch('../content.json?_=' + Date.now())
          .then(function (r) { return r.json(); })
          .then(function (content) { self.setState({ theme: content.theme }); })
          .catch(function () { /* si falla, se queda sin tema, no rompe nada */ });
      },
      render: function () {
        var data = this.props.entry.getIn(['data']);
        var plainEv = data ? data.toJS() : {};
        var estiloTema = this.state.theme ? TratakRender.themeStyleTag(this.state.theme) : '';
        var temas = (plainEv.temas || []).map(function (t) {
          return '<div class="topic"><div class="tag">' + (t.tag || '') + '</div><h3>' + (t.title || '') + '</h3><p>' + (t.text || '') + '</p></div>';
        }).join('');
        var perfil = (plainEv.perfil || []).map(function (p) {
          return '<span>' + (typeof p === 'string' ? p : (p.perfil_item || '')) + '</span>';
        }).join('');
        var html = estiloTema +
          (plainEv.es_proximo ? '<p style="color:green;font-weight:bold;padding:12px 24px 0;">★ Marcado como "el próximo" (aparece en el home)</p>' : '') +
          '<section class="hero"><p class="kicker">Taller demostrativo — cupo abierto</p>' +
          '<h1>' + (plainEv.titulo_evento_html || '') + '</h1>' +
          '<p class="lede">' + (plainEv.descripcion || '') + '</p>' +
          '<div class="facts">' +
          '<div class="fact"><div class="k">Fecha</div><div class="v">' + (plainEv.fecha || '') + '</div></div>' +
          '<div class="fact"><div class="k">Horario</div><div class="v">' + (plainEv.horario || '') + '</div></div>' +
          '<div class="fact"><div class="k">Sede</div><div class="v editable">' + (plainEv.sede || '') + '</div></div>' +
          '</div><p class="aporte-note">' + (plainEv.aporte_texto || '') + '</p></section>' +
          '<section class="explora"><h2>Qué vas a explorar</h2><div class="topics">' + temas + '</div></section>' +
          '<section class="para-quien"><h2>Para quién es</h2><div class="perfil-list">' + perfil + '</div></section>';
        return h('div', { dangerouslySetInnerHTML: { __html: html } });
      }
    });
    CMS.registerPreviewTemplate('eventos', EventoIndividualPreview);
  </script>
</body>
</html>
