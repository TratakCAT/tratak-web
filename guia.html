<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon_32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon_16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon_180.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="styles.css?v=38">
<link rel="stylesheet" href="assets/shishi.css?v=38">
<meta name="apple-mobile-web-app-title" content="TRATAK CAT">
<meta name="theme-color" content="#b9edb2">
<title>Guía de consulta de biomateriales · TRATAK CAT</title>
<meta name="description" content="Materiales base, glosario y familias de biomateriales con fuentes. TRATAK CAT.">
<style>
  :root{ --tk-ink:#241f18; --tk-mor:#6d49b8; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ min-height:100vh; background:linear-gradient(160deg,#c9a6ee 0%,#a9d2f0 55%,#c3f0b9 100%) fixed !important; }
  .app{ max-width:760px; margin:0 auto; padding:18px 16px 120px; color:var(--tk-ink); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  body.con-nav .app{ padding-top:10px; }
  .app .card{ background:rgba(255,255,255,.9); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:26px; padding:22px 20px 24px; box-shadow:0 12px 40px rgba(60,40,110,.16); color:var(--tk-ink); margin-bottom:14px; }
  .app h1,.app h2,.app h3{ font-family:Georgia,'Times New Roman',serif; font-weight:400; margin:0 0 10px; line-height:1.1; color:var(--tk-ink); max-width:none; }
  .app h1{ font-size:clamp(32px,8.4vw,46px); } .app h2{ font-size:clamp(23px,6vw,28px); } .app h3{ font-size:21px; }
  .app h1 em{ color:var(--tk-mor); }
  .app p{ margin:0 0 10px; font-size:16px; line-height:1.5; color:var(--tk-ink); } .app .suave{ opacity:.72; font-size:14.5px; }
  .app .tag{ display:inline-block; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; background:var(--tk-ink); color:#fff; border-radius:999px; padding:6px 12px; margin-bottom:12px; }
  [hidden]{ display:none !important; }
  .tabs{ display:flex; gap:6px; background:rgba(255,255,255,.55); padding:5px; border-radius:999px; margin-bottom:12px; position:sticky; top:6px; z-index:5; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .tabs button{ flex:1; border:0; background:transparent; font:inherit; font-size:15px; font-weight:700; padding:11px 6px; border-radius:999px; color:var(--tk-ink); cursor:pointer; }
  .tabs button[aria-selected=true]{ background:var(--tk-ink); color:#fff; }
  .busca{ width:100%; font:inherit; font-size:16.5px; padding:13px 16px; border-radius:999px; border:1.5px solid rgba(36,31,24,.22); background:#fff; color:var(--tk-ink); margin-bottom:10px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip{ border:1.5px solid rgba(36,31,24,.25); background:rgba(255,255,255,.75); border-radius:999px; font:inherit; font-size:14px; font-weight:600; padding:7px 12px; cursor:pointer; color:var(--tk-ink); }
  .chip[aria-pressed=true]{ background:var(--tk-ink); color:#fff; border-color:var(--tk-ink); }
  .gr{ font-family:Georgia,serif; font-size:19px; margin:18px 4px 8px; color:var(--tk-ink); }
  .f{ background:rgba(255,255,255,.92); border-radius:20px; padding:15px 16px 13px; margin-bottom:10px; box-shadow:0 6px 20px rgba(60,40,110,.12); }
  .f .cab{ display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .f .cab b{ font-family:Georgia,serif; font-weight:400; font-size:21px; line-height:1.15; }
  .f .ori{ font-size:12.5px; font-weight:700; border-radius:999px; padding:4px 10px; background:#efeaf9; }
  .f .ori.V{ background:#e3f4d8; } .f .ori.A{ background:#fde9d9; } .f .ori.M{ background:#e0eefc; } .f .ori.N{ background:#ececec; } .f .ori.X{ background:#f3e8ff; }
  .f dl{ margin:0; } .f dt{ font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; opacity:.55; margin-top:8px; }
  .f dd{ margin:2px 0 0; font-size:15.5px; line-height:1.45; }
  .f .cuid{ background:#fff4d9; border-radius:12px; padding:8px 10px; margin-top:10px; font-size:14.5px; }
  .ref{ display:inline-block; font-size:12px; font-weight:700; min-width:22px; text-align:center; padding:1px 6px; margin:0 2px 0 0; border-radius:999px; background:#ece8f7; color:var(--tk-mor); text-decoration:none; }
  .fu{ margin-top:10px; font-size:13px; opacity:.9; }
  .fu .sin{ font-style:italic; opacity:.65; }
  a.gl{ color:var(--tk-mor); text-decoration:underline dotted; cursor:pointer; }
  .vacio{ text-align:center; padding:26px 10px; font-size:16px; color:var(--tk-ink); }
  details.fuentes{ background:rgba(255,255,255,.92); border-radius:20px; padding:14px 16px; margin-top:18px; }
  details.fuentes summary{ font-weight:700; cursor:pointer; font-size:16px; }
  details.fuentes ol{ padding-left:0; list-style:none; margin:10px 0 0; }
  details.fuentes li{ font-size:13.5px; line-height:1.4; margin-bottom:8px; padding:6px 8px; border-radius:10px; word-break:break-word; }
  details.fuentes li b{ color:var(--tk-mor); } details.fuentes li.hl{ background:#fff4d9; }
  .nota{ font-size:13.5px; opacity:.75; margin:6px 4px 0; color:var(--tk-ink); }
</style>
</head>
<body>
<div id="site-top"></div>
<div id="site-floating"></div>
<div class="app">
  <div class="card">
    <span class="tag">Guía de consulta</span>
    <h1>Biomateriales, <em>explicados</em></h1>
    <p>Busca un material, un término o una familia. Cada dato trae el número de su fuente.</p>
    <p class="suave">🌿 vegetal · 🐾 animal · 🦠 microbiano · 🪨 mineral &nbsp;·&nbsp; <a href="recursos.html" style="color:inherit">← Recursos</a></p>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-materiales" aria-selected="true" data-t="materiales">🧪 Materiales</button>
    <button role="tab" id="t-glosario" aria-selected="false" data-t="glosario">📘 Glosario</button>
    <button role="tab" id="t-familias" aria-selected="false" data-t="familias">🌳 Familias</button>
  </div>
  <div id="barra">
    <input type="search" class="busca" id="q" placeholder="Buscar…" aria-label="Buscar">
    <div class="chips" id="chips"></div>
  </div>
  <div id="lista"></div>
  <p class="nota" id="rev"></p>
  <details class="fuentes" id="fuentes"><summary>Fuentes (<span id="nf"></span>)</summary><ol id="of"></ol></details>
</div>
<script src="assets/site.js?v=45"></script>
<script src="assets/shishi.js?v=38"></script>
<script>
(function () {
  var D, tab = 'materiales', origen = '', q = '';
  var $ = function (i) { return document.getElementById(i); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function refs(a) {
    if (!a || !a.length) return '<span class="sin">Sin cita externa (prueba o criterio del taller)</span>';
    return 'Fuentes: ' + a.map(function (n) { return '<a class="ref" href="#f' + n + '" data-f="' + n + '">' + n + '</a>'; }).join('');
  }
  var TERMS = ['reticulación iónica', 'gelatinización', 'retrogradación', 'termorreversible', 'desnaturalización', 'adelgazamiento por cizalla', 'plastificante', 'carga', 'hidrogel'];
  function conLinks(t) {
    var h = esc(t);
    TERMS.forEach(function (w) {
      var re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
      if (w === 'carga') return;
      h = h.replace(re, '<a class="gl" data-g="' + esc(w) + '">$1</a>');
    });
    return h;
  }
  function vacio() { return '<div class="vacio">No encontré nada con esa búsqueda 🔍</div>'; }
  function pMat() {
    var out = '', g = '', n = 0;
    D.materiales.forEach(function (m) {
      if (origen && m.origen !== origen) return;
      var hay = norm([m.nombre, m.que, m.activa, m.usos, m.cuidado, m.grupo].join(' '));
      if (q && hay.indexOf(q) < 0) return;
      n++;
      if (m.grupo !== g) { g = m.grupo; out += '<h2 class="gr">' + esc(g) + '</h2>'; }
      var o = D.origen[m.origen];
      out += '<article class="f" id="m-' + esc(norm(m.nombre).replace(/[^a-z0-9]+/g, '-')) + '"><div class="cab"><span style="font-size:26px">' + o[0] + '</span><b>' + esc(m.nombre) + '</b><span class="ori ' + m.origen + '">' + o[1] + '</span></div><dl>' +
        '<dt>Qué es</dt><dd>' + esc(m.que) + '</dd><dt>Cómo se activa</dt><dd>' + conLinks(m.activa) + '</dd><dt>Usos</dt><dd>' + esc(m.usos) + '</dd></dl>' +
        (m.cuidado && m.cuidado !== '—' ? '<div class="cuid">⚠️ ' + esc(m.cuidado) + '</div>' : '') +
        '<div class="fu">' + refs(m.fuentes) + '</div></article>';
    });
    return n ? out : vacio();
  }
  function pGlo() {
    var out = '', n = 0, l = '';
    D.glosario.forEach(function (t) {
      var hay = norm(t.t + ' ' + t.d + ' ' + t.e);
      if (q && hay.indexOf(q) < 0) return;
      n++;
      var L = norm(t.t)[0].toUpperCase();
      if (L !== l) { l = L; out += '<h2 class="gr">' + L + '</h2>'; }
      out += '<article class="f" id="g-' + esc(norm(t.t).replace(/[^a-z0-9]+/g, '-')) + '"><div class="cab"><b>' + esc(t.t) + '</b></div><dl><dt>Significa</dt><dd>' + esc(t.d) + '</dd><dt>Ejemplo</dt><dd>' + esc(t.e) + '</dd></dl><div class="fu">' + refs(t.fuentes) + '</div></article>';
    });
    return n ? out : vacio();
  }
  function pFam() {
    var out = '', n = 0;
    D.familias.forEach(function (f) {
      if (q && norm([f.f, f.o, f.a, f.p, f.q].join(' ')).indexOf(q) < 0) return;
      n++;
      out += '<article class="f"><div class="cab"><b>' + esc(f.f) + '</b></div><dl><dt>Origen del material</dt><dd>' + esc(f.o) + '</dd><dt>Qué lo une</dt><dd>' + esc(f.a) + '</dd><dt>Proceso</dt><dd>' + esc(f.p) + '</dd><dt>Quién lo construye</dt><dd>' + esc(f.q) + '</dd></dl><div class="fu">' + refs(f.fuentes) + '</div></article>';
    });
    return n ? out : vacio();
  }
  function pintar() {
    $('lista').innerHTML = tab === 'materiales' ? pMat() : tab === 'glosario' ? pGlo() : pFam();
    $('chips').style.display = tab === 'materiales' ? 'flex' : 'none';
    $('q').placeholder = tab === 'materiales' ? 'Buscar un material, uso o propiedad…' : tab === 'glosario' ? 'Buscar un término…' : 'Buscar una familia…';
    ['materiales', 'glosario', 'familias'].forEach(function (t) { $('t-' + t).setAttribute('aria-selected', t === tab ? 'true' : 'false'); });
  }
  function irTab(t, texto) { tab = t; q = texto ? norm(texto) : ''; $('q').value = texto || ''; history.replaceState(null, '', '#' + t); pintar(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function chips() {
    var h = '<button class="chip" data-o="" aria-pressed="true">Todos</button>';
    Object.keys(D.origen).forEach(function (k) { h += '<button class="chip" data-o="' + k + '" aria-pressed="false">' + D.origen[k][0] + ' ' + D.origen[k][1] + '</button>'; });
    $('chips').innerHTML = h;
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-t]'); if (t) { irTab(t.getAttribute('data-t')); return; }
    var c = e.target.closest('.chip'); if (c) { origen = c.getAttribute('data-o'); Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (x) { x.setAttribute('aria-pressed', x === c ? 'true' : 'false'); }); pintar(); return; }
    var g = e.target.closest('a.gl'); if (g) { e.preventDefault(); irTab('glosario', g.getAttribute('data-g')); return; }
    var r = e.target.closest('a.ref'); if (r) {
      e.preventDefault(); var d = $('fuentes'); d.open = true;
      var li = $('f' + r.getAttribute('data-f')); Array.prototype.forEach.call(document.querySelectorAll('#of li.hl'), function (x) { x.classList.remove('hl'); });
      if (li) { li.classList.add('hl'); li.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
  });
  $('q').addEventListener('input', function () { q = norm(this.value.trim()); pintar(); });
  fetch('assets/guia.json?v=1').then(function (r) { return r.json(); }).then(function (d) {
    D = d; chips();
    $('of').innerHTML = D.fuentes.map(function (f) { return '<li id="f' + f.n + '"><b>' + f.n + '.</b> ' + esc(f.t) + ' <a href="' + esc(f.u) + '" target="_blank" rel="noopener">' + esc(f.u.replace(/^https?:\/\//, '').slice(0, 60)) + '</a></li>'; }).join('');
    $('nf').textContent = D.fuentes.length;
    $('rev').textContent = 'Última revisión: ' + D.revision + '. Guía de apoyo: confirma datos críticos (alergias, seguridad) con la fuente.';
    var h = (location.hash || '').replace('#', ''); if (h === 'glosario' || h === 'familias') tab = h;
    pintar();
  });

  fetch('content.json?_=' + Date.now()).then(function (r) { return r.json(); }).then(function (content) {
    var R = window.TratakRender;
    R.applyTheme(content.theme, document.documentElement.style);
    $('site-top').innerHTML = R.renderNav(content.theme);
    $('site-floating').innerHTML = R.renderFloatingButtons(content.contacto);
    document.body.classList.add('con-nav');
    R.bindGlobalInteractions(content.theme);
    if (window.Shishi) Shishi.montar(content);
  }).catch(function () {});
})();
</script>
</body>
</html>
