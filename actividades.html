<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon_32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon_16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon_180.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="styles.css?v=38">
<link rel="stylesheet" href="assets/shishi.css?v=38">
<meta name="apple-mobile-web-app-title" content="TRATAK CAT">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c9a6ee">
<title>Actividades · TRATAK CAT</title>
<meta name="description" content="Actividades de las clases del curso de TRATAK CAT.">
<style>
  :root{ --tk-ink:#241f18; --tk-mor:#6d49b8; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ min-height:100vh; background:linear-gradient(160deg,#c9a6ee 0%,#a9d2f0 55%,#c3f0b9 100%) fixed !important; }
  .app{ max-width:640px; margin:0 auto; padding:18px 16px 120px; color:var(--tk-ink); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  body.con-nav .app{ padding-top:10px; }
  .app .card{ background:rgba(255,255,255,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:26px; padding:22px 20px 24px; box-shadow:0 12px 40px rgba(60,40,110,.16); color:var(--tk-ink); margin-bottom:16px; }
  .app h1,.app h2{ font-family:Georgia,'Times New Roman',serif; font-weight:400; margin:0 0 10px; line-height:1.1; color:var(--tk-ink); max-width:none; }
  .app h1{ font-size:clamp(32px,8.4vw,46px); } .app h2{ font-size:clamp(23px,6vw,28px); }
  .app h1 em{ color:var(--tk-mor); }
  .app p{ margin:0 0 12px; font-size:16px; line-height:1.5; color:var(--tk-ink); } .app .suave{ opacity:.75; font-size:14.5px; }
  .app .tag{ display:inline-block; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; background:var(--tk-ink); color:#fff; border-radius:999px; padding:6px 12px; margin-bottom:12px; }
  .app label{ display:block; font-weight:700; font-size:15px; margin:16px 0 6px; }
  .app input[type=text]{ width:100%; font:inherit; font-size:16.5px; padding:13px 14px; border-radius:16px; border:1.5px solid rgba(36,31,24,.22); background:#fff; color:var(--tk-ink); }
  .app .btn{ display:block; width:100%; border:0; border-radius:999px; padding:16px 20px; font:inherit; font-size:16.5px; font-weight:700; cursor:pointer; text-align:center; text-decoration:none; background:var(--tk-ink); color:#fff; margin-top:18px; }
  .app .cero{ border:2px solid var(--tk-ink); }
  .app .cero .num{ display:inline-flex; width:44px; height:44px; border-radius:50%; background:var(--tk-ink); color:#fff; font-family:Georgia,serif; font-size:26px; align-items:center; justify-content:center; margin-bottom:10px; }
  .app .top-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .app .top-head i{ width:14px; height:14px; border-radius:50%; flex:none; }
  .app .top-head h2{ margin:0; }
  .app .clases{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .app .clase{ position:relative; border:1.5px dashed rgba(36,31,24,.3); border-radius:16px; background:rgba(255,255,255,.6); padding:14px 6px 12px; font:inherit; text-align:center; color:var(--tk-ink); opacity:.7; cursor:not-allowed; }
  .app .clase b{ display:block; font-family:Georgia,serif; font-size:24px; font-weight:400; }
  .app .clase span{ display:block; font-size:12px; font-weight:600; opacity:.75; }
  .app .clase .cand{ position:absolute; top:6px; right:8px; font-size:13px; }
  .app .clase{ opacity:1; cursor:pointer; border-style:solid; background:rgba(255,255,255,.85); }
  .app .clase.t{ border-width:2px; }
  .app .clase .cand{ opacity:.55; }
  .app .clase{ padding:18px 6px 16px; } .app .clase b{ font-size:28px; }
  .app .btn.sec{ background:transparent; color:var(--tk-ink); border:1.5px solid var(--tk-ink); font-weight:600; margin-top:10px; }
  .modal{ position:fixed; inset:0; background:rgba(36,31,24,.55); display:flex; align-items:flex-end; justify-content:center; padding:16px; z-index:60; }
  .modal-caja{ width:100%; max-width:480px; background:#fff; border-radius:26px; padding:22px 20px 22px; color:var(--tk-ink); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .modal-caja h2{ font-family:Georgia,serif; font-weight:400; font-size:26px; margin:0 0 6px; }
  .modal-caja .tag{ display:inline-block; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; background:var(--tk-ink); color:#fff; border-radius:999px; padding:6px 12px; margin-bottom:10px; }
  .modal-caja label{ display:block; font-weight:700; font-size:15px; margin:14px 0 6px; }
  .modal-caja input{ width:100%; font:inherit; font-size:16.5px; padding:13px 14px; border-radius:16px; border:1.5px solid rgba(36,31,24,.22); }
  .modal-caja .btn{ display:block; width:100%; border:0; border-radius:999px; padding:15px 20px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; background:var(--tk-ink); color:#fff; margin-top:14px; }
  .modal-caja .btn.sec{ background:transparent; color:var(--tk-ink); border:1.5px solid var(--tk-ink); font-weight:600; margin-top:8px; }
  .aviso-toast{ position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:var(--tk-ink); color:#fff; padding:12px 18px; border-radius:999px; font-size:14.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; max-width:90vw; text-align:center; }
  .aviso-toast.on{ opacity:1; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="site-top"></div>
<div id="site-floating"></div>
<div class="app">
  <div id="hub">
    <div class="card">
      <span class="tag">Actividades</span>
      <h1>Cada actividad, <em>su clave</em></h1>
      <p>Elige una actividad y escribe su clave. Cada una tiene la suya, y la da quien dirige la actividad.</p>
    </div>

    <div class="card">
      <div class="top-head"><i style="background:#f2c94c"></i><h2>Actividades generales</h2></div>
      <div class="clases" id="generales"></div>
    </div>

    <div id="topicos"></div>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="m-titulo">
    <span class="tag" id="m-tag"></span>
    <h2 id="m-titulo"></h2>
    <label for="clave">Clave de esta actividad</label>
    <input type="text" id="clave" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Escríbela aquí">
    <p id="m-error" class="suave" style="color:#b3261e;margin-top:8px" hidden></p>
    <button class="btn" id="entrar">Entrar</button>
    <button class="btn sec" id="cerrar" type="button">Cancelar</button>
  </div>
</div>

<script src="assets/site.js?v=44"></script>
<script src="assets/shishi.js?v=38"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  // Cada actividad tiene su propia clave (guardada como huella, no en claro).
  // Para activar una actividad: pon su 'hash' (se calcula con la misma función) y su 'url'.
  // Es un filtro para la clase, no seguridad real.
  function norm(t) { return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
  function cyrb53(str) { var h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (var i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); }

  var ACT = {};  // id -> { nombre, hash, url }
  ACT['g0'] = { nombre: 'Materia y ser', hash: '1dy0hpoubsn', url: 'taller.html' };

  var GENERALES = [ { id: 'g0', n: '0' }, { id: 'g1', n: '1' }, { id: 'g2', n: '2' } ];
  var TOPICOS = [
    { id: 't1', n: 'Impresión 3D', c: '#c0a2ec' },
    { id: 't2', n: 'Diseño en Realidad Virtual', c: '#9fcbec' },
    { id: 't3', n: 'Cultura Biomaterial', c: '#b9edb2' }
  ];

  var actual = null;
  function abrirModal(id, etiqueta, titulo) {
    actual = id; $('m-tag').textContent = etiqueta; $('m-titulo').textContent = titulo;
    $('clave').value = ''; $('m-error').hidden = true; $('modal').hidden = false;
    setTimeout(function () { $('clave').focus(); }, 50);
  }
  function cerrarModal() { $('modal').hidden = true; actual = null; }
  function probar() {
    var a = ACT[actual];
    if (!a) { $('m-error').textContent = 'Esta actividad todavía no tiene clave.'; $('m-error').hidden = false; return; }
    if (cyrb53(norm($('clave').value)) !== a.hash) { $('m-error').textContent = 'Esa no es la clave de esta actividad.'; $('m-error').hidden = false; return; }
    try { sessionStorage.setItem('tk-act-' + actual, '1'); } catch (e) {}
    location.href = a.url;
  }
  $('entrar').onclick = probar; $('cerrar').onclick = cerrarModal;
  $('clave').addEventListener('keydown', function (e) { if (e.key === 'Enter') probar(); if (e.key === 'Escape') cerrarModal(); });
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) cerrarModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) cerrarModal(); });

  function tile(cont, id, num, cap, etiqueta, titulo, clase) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'clase ' + (clase || '');
    b.innerHTML = '<span class="cand">🔑</span><b></b>'; b.querySelector('b').textContent = num; b.setAttribute('aria-label', etiqueta + ', actividad ' + num);
    b.onclick = function () { abrirModal(id, etiqueta, titulo); };
    cont.appendChild(b);
  }
  GENERALES.forEach(function (g) { tile($('generales'), g.id, g.n, '', 'Actividades generales', 'Actividad ' + g.n, 't'); });
  var cont = $('topicos');
  TOPICOS.forEach(function (tp) {
    var card = document.createElement('div'); card.className = 'card';
    var h = document.createElement('div'); h.className = 'top-head';
    var dot = document.createElement('i'); dot.style.background = tp.c; var h2 = document.createElement('h2'); h2.textContent = tp.n; h.appendChild(dot); h.appendChild(h2); card.appendChild(h);
    var g = document.createElement('div'); g.className = 'clases';
    for (var i = 1; i <= 6; i++) tile(g, tp.id + 'c' + i, i, '', tp.n, 'Actividad ' + i);
    card.appendChild(g); cont.appendChild(card);
  });

  fetch('content.json?_=' + Date.now()).then(function (r) { return r.json(); }).then(function (content) {
    var R = window.TratakRender;
    R.applyTheme(content.theme, document.documentElement.style);
    $('site-top').innerHTML = R.renderNav(content.theme);
    $('site-floating').innerHTML = R.renderFloatingButtons(content.contacto);
    document.body.classList.add('con-nav');
    R.bindGlobalInteractions(content.theme);
    if (window.Shishi) Shishi.montar(content);
  }).catch(function () {});
})();
</script>
</body>
</html>
