<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon_32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon_180.png">
<meta name="theme-color" content="#c9a6ee">
<title>TRATAK CAT · Todos los enlaces</title>
<meta name="description" content="Todo TRATAK CAT en un solo lugar: clases, talleres, Heyokat, investigación y contacto.">
<meta property="og:title" content="TRATAK CAT · Todos los enlaces">
<meta property="og:description" content="Clases, talleres, el oráculo Heyokat, investigación y contacto.">
<meta property="og:image" content="https://tratakcat.com/icons/icon_512.png">
<style>
  :root{ --ink:#241f18; --lila:#c0a2ec; --azul:#9fcbec; --verde:#b9edb2; --oro:#f2c94c; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{ min-height:100vh; color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:linear-gradient(160deg,#c9a6ee 0%,#a9d2f0 55%,#c3f0b9 100%) fixed; }
  .wrap{ max-width:640px; margin:0 auto; padding:34px 16px 60px; }
  header{ text-align:center; }
  .av{ width:104px; height:104px; border-radius:50%; background:#fff; padding:6px; box-shadow:0 10px 30px rgba(36,31,24,.18); object-fit:contain; display:block; margin:0 auto 12px; }
  h1{ margin:0; font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:clamp(28px,7vw,38px); }
  .bio{ margin:6px auto 0; max-width:30em; font-size:15px; line-height:1.45; opacity:.8; }
  .redes{ display:flex; gap:10px; justify-content:center; margin:16px 0 4px; }
  .redes a{ width:46px; height:46px; display:grid; place-items:center; border-radius:50%; background:rgba(255,255,255,.8); text-decoration:none; font-size:21px; box-shadow:0 4px 14px rgba(36,31,24,.12); transition:transform .15s; }
  .redes a:hover{ transform:translateY(-2px); }
  .buscar{ position:relative; margin:20px 0 10px; }
  .buscar input{ width:100%; border:0; border-radius:999px; padding:14px 18px 14px 46px; font:inherit; font-size:16px; background:rgba(255,255,255,.88); box-shadow:0 4px 16px rgba(36,31,24,.1); outline:2px solid transparent; }
  .buscar input:focus{ outline-color:#241f18; }
  .buscar::before{ content:'🔍'; position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:16px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; border:0; border-radius:999px; padding:9px 15px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; background:rgba(255,255,255,.6); color:var(--ink); white-space:nowrap; }
  .chip[aria-pressed="true"]{ background:var(--ink); color:#fff; }
  .sec{ margin:14px 0 0; background:rgba(255,255,255,.55); border-radius:24px; overflow:hidden; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .sec > button{ all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:10px; padding:16px 18px; cursor:pointer; font-weight:700; font-size:16.5px; }
  .sec > button .n{ margin-left:auto; font-size:12.5px; font-weight:600; opacity:.6; }
  .sec > button .fl{ transition:transform .25s; opacity:.6; }
  .sec[data-abierta="true"] > button .fl{ transform:rotate(90deg); }
  .sec .lista{ display:none; padding:0 12px 14px; gap:10px; flex-direction:column; }
  .sec[data-abierta="true"] .lista{ display:flex; }
  a.enl{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:18px; background:#fff; color:var(--ink); text-decoration:none; box-shadow:0 3px 12px rgba(36,31,24,.08); transition:transform .15s, box-shadow .15s; position:relative; }
  a.enl:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(36,31,24,.14); }
  a.enl.dest{ background:linear-gradient(120deg,#241f18,#3b2f4e); color:#fff; }
  a.enl .ic{ flex:none; width:44px; height:44px; display:grid; place-items:center; border-radius:14px; background:linear-gradient(135deg,#efe5ff,#dff0ff); font-size:22px; }
  a.enl.dest .ic{ background:rgba(255,255,255,.14); }
  a.enl .tx{ flex:1; min-width:0; }
  a.enl b{ display:block; font-size:16px; line-height:1.25; }
  a.enl span.d{ display:block; font-size:13.5px; opacity:.72; margin-top:2px; line-height:1.35; }
  a.enl .et{ position:absolute; top:-7px; right:14px; background:var(--oro); color:var(--ink); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:999px; }
  a.enl .go{ flex:none; opacity:.4; font-size:18px; }
  .bi{ display:block; width:100%; height:100%; }
  .redes a.b-ig,a.enl .ic.b-ig{ background:linear-gradient(45deg,#f9a03a,#e1306c 55%,#833ab4); color:#fff; }
  .redes a.b-wa,a.enl .ic.b-wa{ background:#25d366; color:#fff; }
  .redes a.b-yt,a.enl .ic.b-yt{ background:#ff0000; color:#fff; }
  .redes a svg{ width:24px; height:24px; }
  a.enl .ic svg{ width:26px; height:26px; }
  .vacio{ text-align:center; margin:26px 0; opacity:.75; }
  footer{ text-align:center; margin-top:30px; font-size:13.5px; }
  footer a{ color:var(--ink); font-weight:600; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="av" id="av" alt="TRATAK CAT" src="icons/icon_192.png">
    <h1 id="nombre">@Tratak.CAT</h1>
    <p class="bio" id="bio"></p>
    <div class="redes" id="redes"></div>
  </header>
  <div class="buscar" id="buscar" hidden><input id="q" type="search" placeholder="Buscar clases, eventos, enlaces…" aria-label="Buscar enlaces" autocomplete="off"></div>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por sección"></div>
  <main id="lista"></main>
  <p class="vacio" id="vacio" hidden>No encontré nada con eso. Prueba con otra palabra o escríbenos por WhatsApp.</p>
  <footer><a href="/">Ir a la página completa de TRATAK CAT →</a></footer>
</div>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function seguro(u) { u = String(u || '').trim(); return /^(https?:|mailto:|tel:|\/|#)/i.test(u) ? u : (u ? 'https://' + u : '#'); }
  var D = null, filtro = '', sec = '';
  var SVG = {
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.3 21.8l4.9-1.3A9.8 9.8 0 1 0 12 2.2z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><g transform="translate(5.7 5.6) scale(.53)" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></g></svg>',
    youtube: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10 9l5.2 3L10 15z" fill="currentColor"/></svg>'
  };
  var CLASE = { instagram: 'b-ig', whatsapp: 'b-wa', youtube: 'b-yt' };
  function icono(k) { return SVG[k] || esc(k); }
  function iconoPorDefecto(u) { u = u.toLowerCase(); return u.indexOf('wa.me') > -1 || u.indexOf('whatsapp') > -1 ? 'whatsapp' : u.indexOf('instagram') > -1 ? 'instagram' : u.indexOf('youtu') > -1 ? 'youtube' : u.indexOf('drive.google') > -1 ? '📁' : u.indexOf('tratakcat.com') > -1 ? '🌐' : '🔗'; }
  function enlace(e) {
    var ic = e.icono || iconoPorDefecto(e.url || ''), ext = /^https?:/i.test(e.url) && e.url.indexOf(location.host) < 0;
    return '<a class="enl' + (e.destacado ? ' dest' : '') + '" href="' + esc(seguro(e.url)) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' +
      (e.etiqueta ? '<i class="et" style="font-style:normal">' + esc(e.etiqueta) + '</i>' : '') +
      '<span class="ic ' + (CLASE[ic] || '') + '">' + icono(ic) + '</span>' +
      '<span class="tx"><b>' + esc(e.titulo) + '</b>' + (e.descripcion ? '<span class="d">' + esc(e.descripcion) + '</span>' : '') + '</span><span class="go">›</span></a>';
  }
  function pinta() {
    var q = norm(filtro), total = 0, h = '';
    (D.secciones || []).forEach(function (s, i) {
      if (sec !== '' && String(i) !== sec) return;
      var items = (s.enlaces || []).filter(function (e) { return !q || norm(e.titulo + ' ' + (e.descripcion || '') + ' ' + s.titulo).indexOf(q) > -1; });
      if (!items.length) return; total += items.length;
      var abierta = q || sec !== '' ? true : (s.abierta !== false);
      h += '<section class="sec" data-abierta="' + abierta + '"><button type="button" aria-expanded="' + abierta + '"><span>' + esc(s.icono || '') + '</span><span>' + esc(s.titulo) + '</span><span class="n">' + items.length + '</span><span class="fl">›</span></button><div class="lista">' + items.map(enlace).join('') + '</div></section>';
    });
    $('lista').innerHTML = h; $('vacio').hidden = total > 0;
  }
  function $(id) { return document.getElementById(id); }
  function chips() {
    var h = '<button class="chip" type="button" data-s="" aria-pressed="true">Todo</button>';
    (D.secciones || []).forEach(function (s, i) { h += '<button class="chip" type="button" data-s="' + i + '" aria-pressed="false">' + esc((s.icono || '') + ' ' + s.titulo) + '</button>'; });
    $('chips').innerHTML = h; $('chips').hidden = (D.secciones || []).length < 3;
  }
  fetch('links.json?_=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    D = d; $('nombre').textContent = d.nombre || ''; $('bio').textContent = d.bio || ''; if (d.avatar) $('av').src = d.avatar;
    $('redes').innerHTML = (d.redes || []).map(function (r) { var k = r.icono || iconoPorDefecto(r.url); return '<a class="' + (CLASE[k] || '') + '" href="' + esc(seguro(r.url)) + '" target="_blank" rel="noopener" aria-label="' + esc(r.titulo) + '" title="' + esc(r.titulo) + '">' + icono(k) + '</a>'; }).join('');
    var n = 0; (d.secciones || []).forEach(function (s) { n += (s.enlaces || []).length; });
    $('buscar').hidden = d.buscador === false || n < 8;
    chips(); pinta();
    $('q').addEventListener('input', function (e) { filtro = e.target.value; pinta(); });
    $('chips').addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (!b) return; sec = b.getAttribute('data-s'); Array.prototype.forEach.call($('chips').children, function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); }); pinta(); });
    $('lista').addEventListener('click', function (e) { var b = e.target.closest('.sec > button'); if (!b) return; var s = b.parentNode, a = s.getAttribute('data-abierta') !== 'true'; s.setAttribute('data-abierta', a); b.setAttribute('aria-expanded', a); });
  }).catch(function () { $('lista').innerHTML = '<p class="vacio">No pude cargar los enlaces. Escríbenos por <a href="https://wa.me/523332480698">WhatsApp</a>.</p>'; });
})();
</script>
</body>
</html>
